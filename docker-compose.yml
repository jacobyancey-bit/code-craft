services:
  postgres:
    image: postgres:16-alpine
    container_name: codecraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codecraft_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codecraft_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  pgdata:
